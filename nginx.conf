server {
    listen 80;
    server_name localhost;

    # Serve frontend static files from Nginx
    root /usr/share/nginx/html;
    index index.html;

    # ── Proxy /api/* → FastAPI backend ──────────────────────
    # 'backend' resolves to the FastAPI container via Docker's internal network
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Proxy /status/* → FastAPI backend (public status page, no auth) ──
    location /status/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Proxy /docs and /openapi.json (Swagger UI) ──────────
    location /docs {
        proxy_pass http://backend:8000;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
    }

    # ── Frontend — serve HTML files directly ─────────────────
    # try_files serves the file if it exists, otherwise falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
