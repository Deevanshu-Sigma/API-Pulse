<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — API Pulse</title>
  <meta name="description" content="Sign in to Keep an Eye — your lightweight uptime monitoring dashboard." />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<main class="auth-page">
  <div class="auth-card">

    <!-- Brand -->
    <div class="auth-brand">
      <div class="auth-brand-icon">⚡</div>
      <h1>API Pulse</h1>
      <p>Monitor your websites, stay ahead of downtime.</p>
    </div>

    <!-- Error message -->
    <div class="error-msg" id="login-error"></div>

    <!-- Login Form -->
    <form class="auth-form" id="login-form" novalidate>
      <div class="form-group">
        <label class="form-label" for="login-email">Email address</label>
        <input
          class="form-input"
          type="email"
          id="login-email"
          placeholder="you@example.com"
          required
          autocomplete="email"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="login-password">Password</label>
        <input
          class="form-input"
          type="password"
          id="login-password"
          placeholder="••••••••"
          required
          autocomplete="current-password"
        />
      </div>

      <button class="btn btn-primary btn-full btn-lg" type="submit" id="login-btn">
        Sign in
      </button>
    </form>

    <!-- Footer link -->
    <p class="text-muted" style="text-align:center;">
      Don't have an account? <a href="register.html">Create one →</a>
    </p>

  </div>
</main>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
